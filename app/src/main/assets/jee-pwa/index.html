<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0f">
<title>JEE Practice Session</title>
<link rel="stylesheet" href="styles.css">
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$','$'],['\\(','\\)']],
    displayMath: [['$$','$$'],['\\[','\\]']],
    processEscapes: true
  },
  svg: { fontCache: 'global' },
  startup: { typeset: false }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>

<header class="header">
  <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Menu">
    <svg width="18" height="14" viewBox="0 0 18 14" fill="none">
      <path d="M0 1H18M0 7H18M0 13H18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <div class="logo">JEE Main <span>Practice</span></div>

  <div class="header-search">
    <span class="search-icon">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10 10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </span>
    <input type="search" id="global-search" placeholder="Search questions… (/)" autocomplete="off" autocorrect="off" spellcheck="false">
  </div>

  <div class="header-right">
    <button class="icon-btn" onclick="renderProgressPage()" title="Progress (P)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="9" width="3" height="6" rx="1" fill="currentColor" opacity="0.5"/>
        <rect x="6.5" y="5" width="3" height="10" rx="1" opacity="0.75" fill="currentColor"/>
        <rect x="12" y="1" width="3" height="14" rx="1" fill="currentColor"/>
      </svg>
    </button>
    <button class="icon-btn" onclick="openMockModal()" title="Mock Test">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 4.5V8L10.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">☀</button>
  </div>
</header>

<div class="layout">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-tabs">
      <button class="stab active" data-sub="Physics"     onclick="buildChapterList('Physics')">Physics</button>
      <button class="stab"        data-sub="Chemistry"   onclick="buildChapterList('Chemistry')">Chem</button>
      <button class="stab"        data-sub="Mathematics" onclick="buildChapterList('Mathematics')">Math</button>
    </div>
    <div class="sidebar-search-wrap">
      <input type="search" class="sidebar-search" id="sidebar-search"
        placeholder="Filter chapters…" autocomplete="off"
        oninput="buildChapterList(state.subject)">
    </div>
    <div class="chapter-list" id="chapter-list"></div>
    <div class="sidebar-footer">
      <div class="sf-row">
        <span class="sf-label">Overall Progress</span>
        <span class="sf-val" id="global-text">—</span>
      </div>
      <div class="global-progress">
        <div class="global-progress-fill" id="global-fill" style="width:0%"></div>
      </div>
    </div>
  </aside>

  <main class="main" id="main-panel"></main>
</div>

<div class="modal-overlay" id="mock-modal">
  <div class="modal">
    <div class="modal-title">⏱ Start Mock Test</div>
    <div class="modal-sub">Practice against the clock. Only unattempted questions.</div>
    <div class="modal-field">
      <label>Subject</label>
      <select id="mock-subject" onchange="populateMockChapters()">
        <option value="Physics">Physics</option>
        <option value="Chemistry">Chemistry</option>
        <option value="Mathematics">Mathematics</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Chapter</label>
      <select id="mock-chapter"><option value="all">All Chapters</option></select>
    </div>
    <div class="modal-field">
      <label>Duration (minutes)</label>
      <input type="number" id="mock-duration" value="30" min="5" max="180">
    </div>
    <div class="modal-field">
      <label>Number of Questions</label>
      <input type="number" id="mock-count" value="20" min="5" max="100">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeMockModal()">Cancel</button>
      <button class="btn btn-primary" onclick="startMock()">▶ Start</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
