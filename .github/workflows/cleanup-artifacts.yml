name: Cleanup All Artifacts

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  delete-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all repository artifacts
        uses: actions/github-script@v7
        with:
          script: |
            let deletedCount = 0;
            while (true) {
              const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              const artifacts = res.data.artifacts;
              if (!artifacts || artifacts.length === 0) {
                console.log(`No more artifacts found. Total deleted: ${deletedCount}`);
                break;
              }
              for (const artifact of artifacts) {
                try {
                  console.log(`Deleting artifact id ${artifact.id} (${artifact.name})...`);
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  deletedCount++;
                } catch (err) {
                  console.log(`Error deleting artifact ${artifact.id}: ${err.message}`);
                }
              }
            }
            console.log(`Successfully cleaned up ${deletedCount} artifacts!`);
