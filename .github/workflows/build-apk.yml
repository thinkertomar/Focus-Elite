name: Android CI - Focus Elite APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure Deterministic Signing Key
        run: |
          if [ -s gradle/focus-elite-signing.b64 ]; then
            tr -d '\r\n ' < gradle/focus-elite-signing.b64 | base64 -d > debug.keystore
            mkdir -p ~/.android
            cp -f debug.keystore ~/.android/debug.keystore
            echo "✅ Deterministic signing key configured for build."
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Focus Elite APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-elite-v1.5.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
